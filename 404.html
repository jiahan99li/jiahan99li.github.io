<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
        (function () {
            var redirectPath = location.pathname + location.search + location.hash;
            sessionStorage.redirect = location.origin + redirectPath;
            location.replace('/');
        })();
    </script>
</head>

<body></body>

</html>
